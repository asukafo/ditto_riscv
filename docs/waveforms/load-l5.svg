<text x="20" y="569" class="small">FQ=fetch request | FW=fetch response | EX=execute | DQ=data request | DW=data response</text>
<text x="20" y="591" class="small">Ck marks a rising edge. Handshakes use values BEFORE that edge; registers/state update AFTER it.</text>
<text x="20" y="609" class="small">Time is relative cycles, not a physical clock-frequency claim. Bus values matter only during valid handshakes.</text>
